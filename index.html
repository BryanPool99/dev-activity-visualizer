<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Activity Visualizer</title>
    <meta
      name="description"
      content="Turns a GitHub account into an interactive visual report: contribution heatmap, languages, streaks, and the hours of the day where the commits land."
    />

    <!-- The icon set is derived from the source in assets/ by scripts/make-icons.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- One theme colour, and the app writes it: the browser's own chrome
         follows the theme in force, not the system's. -->
    <meta name="theme-color" id="app-theme-color" content="#0b0d10" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
